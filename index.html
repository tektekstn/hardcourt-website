<title>HARDCOURT — Under Construction</title>

<style>
:root{--navy:#071b37;--navy-deep:#041126;--gold:#c99b43;--gold-light:#eed29a;--ink:#f7f3eb;--muted:#aeb8c7}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;color:var(--ink);background:radial-gradient(65rem 42rem at 50% 44%,rgba(36,70,111,.38),transparent 63%),radial-gradient(36rem 32rem at 96% 0%,rgba(201,155,67,.11),transparent 68%),linear-gradient(145deg,var(--navy) 0%,var(--navy-deep) 100%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.01em}.page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;position:relative;isolation:isolate}.page:before,.page:after{content:"";position:absolute;pointer-events:none;z-index:-1}.page:before{width:min(84vw,72rem);aspect-ratio:1;border:1px solid rgba(238,210,154,.12);border-radius:50%;left:50%;top:49%;transform:translate(-50%,-50%);box-shadow:0 0 0 5rem #eed29a05,0 0 0 12rem #eed29a03}.page:after{width:1px;height:100%;left:50%;top:0;background:linear-gradient(transparent,rgba(238,210,154,.16),transparent)}header,footer{display:flex;align-items:center;justify-content:space-between;width:min(100% - 3rem,84rem);margin-inline:auto}header{padding:clamp(1.5rem,4vw,3rem) 0}footer{padding:1.5rem 0 clamp(1.5rem,4vw,2.5rem)}.wordmark{display:block;width:clamp(9.5rem,18vw,14rem);height:auto;filter:drop-shadow(0 0 1.4rem rgba(201,155,67,.12))}.status,.location,.eyebrow{margin:0;color:var(--gold-light);font-size:.68rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase}.status{display:flex;align-items:center;gap:.65rem}.status:before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--gold);box-shadow:0 0 1rem var(--gold);animation:pulse 2.4s ease-in-out infinite}main{display:grid;place-items:center;padding:1rem 1.5rem 3rem;text-align:center}.hero{display:grid;justify-items:center;max-width:38rem}.signet-stage{position:relative;width:clamp(12.5rem,30vw,19.5rem);aspect-ratio:1;display:grid;place-items:center;margin-bottom:clamp(1.8rem,4vw,3rem)}.signet-stage:before{content:"";position:absolute;inset:7%;border:1px solid rgba(238,210,154,.35);border-radius:50%;animation:orbit 14s linear infinite}.signet-stage:after{content:"";position:absolute;width:60%;aspect-ratio:1;border-radius:50%;background:var(--gold);filter:blur(3.8rem);opacity:.21}.signet{position:relative;z-index:1;width:68%;height:auto;filter:drop-shadow(0 1rem 2rem rgba(0,0,0,.38));transform-origin:50% 50%;animation:pirouette 8s cubic-bezier(.55,.08,.15,.95) infinite}.eyebrow{margin-bottom:.85rem}h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(3rem,8vw,6.8rem);font-weight:400;line-height:.92;letter-spacing:-.055em}.lead{max-width:29rem;margin:1.5rem auto 0;color:var(--muted);font-size:clamp(1rem,1.8vw,1.16rem);line-height:1.65}.contact{display:inline-flex;align-items:center;gap:.7rem;margin-top:2.1rem;padding-bottom:.45rem;color:var(--ink);font-size:.86rem;text-decoration:none;border-bottom:1px solid rgba(238,210,154,.55);transition:color .2s ease,border-color .2s ease}.contact:after{content:"↗";color:var(--gold-light);font-size:1rem}.contact:hover{color:var(--gold-light);border-color:var(--gold-light)}.legal{color:#aeb8c7ad;font-size:.72rem}@keyframes pirouette{0%,12%{transform:rotate(0) scale(1)}46%{transform:rotate(360deg) scale(1.035)}72%,to{transform:rotate(720deg) scale(1)}}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.38;transform:scale(.7)}}@media(max-width:35rem){header,footer{width:min(100% - 2rem,84rem)}.location{display:none}main{padding-bottom:1.25rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="page">
<header><img class="wordmark" src="assets/hardcourt-wordmark-1200.png" alt="HARDCOURT"><p class="status">In progress</p></header>
<main><section class="hero" aria-labelledby="title"><div class="signet-stage" aria-hidden="true"><img class="signet" src="assets/hardcourt-signet.png" alt=""></div><p class="eyebrow">A new perspective is taking shape</p><h1 id="title">Under<br>construction.</h1><p class="lead">HARDCOURT is building something considered, precise and personal. We will be back soon.</p><a class="contact" href="mailto:assistent@hardcourt.eu">assistent@hardcourt.eu</a></section></main>
<footer><span class="legal">© 2026 HARDCOURT</span><span class="location">München · Deutschland</span></footer>
</div>
</body>
